<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="triweb-version" content="2026-11-24 logo-then-live" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0b1220" />
    <!-- Opening: the TriWeb logo, straight from the HTML (it shows before any
         script runs). It stays while the live 3D scene gets ready behind it,
         then the page opens with everything running (src/App.jsx). -->
    <style>
      html { background: #0b1220; }
      #splash { position: fixed; inset: 0; z-index: 120; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.25rem; background: #0b1220; color: #f4efe9; font-family: 'Outfit Variable', 'Outfit', system-ui, sans-serif; transition: opacity 0.6s ease, visibility 0.6s; }
      #splash.out { opacity: 0; visibility: hidden; }
      #splash svg { height: 6rem; width: auto; border-radius: 0.375rem; box-shadow: 0 20px 80px -10px rgba(255, 58, 32, 0.7); animation: splash-in 0.7s cubic-bezier(0.16, 1, 0.3, 1) both; }
      #splash .w { font-size: 1.25rem; letter-spacing: -0.035em; animation: splash-in 0.7s 0.1s cubic-bezier(0.16, 1, 0.3, 1) both, splash-breathe 1.6s 0.9s ease-in-out infinite; }
      #splash .w b { font-weight: 700; }
      #splash .w span { font-weight: 300; }
      @keyframes splash-in { from { opacity: 0; transform: scale(0.85); } }
      @keyframes splash-breathe { 50% { opacity: 0.5; } }
      @media (prefers-reduced-motion: reduce) { #splash { display: none; } }
    </style>
    <!-- Google Search Console ownership check -->
    <meta name="google-site-verification" content="B3fp9uRKGfvXTJ6KWjIxcoecMaDSSaAMTfDgtArrMr4" />
    <!-- Page title, description, canonical and share tags are written in per page by
         vite.config.js from src/data/seo.js (see seoPages). -->
    <!--seo-->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TriWeb Solutions" />
    <meta name="twitter:card" content="summary_large_image" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "TriWeb Solutions",
        "email": "triwebinnovations@gmail.com",
        "telephone": "+92 323 1554573",
        "sameAs": ["https://www.instagram.com/triwebsolutions/"],
        "url": "__SITE_URL__/",
        "logo": "__SITE_URL__/media/brand/triweb-icon.svg",
        "slogan": "Creative Excellence. Intelligent Technology. Limitless Growth.",
        "founder": [
          { "@type": "Person", "name": "Syed Hamza Ali Zaidi" },
          { "@type": "Person", "name": "Muhammad Rahim" },
          { "@type": "Person", "name": "Anasha Hayyah Khan" }
        ],
        "subOrganization": [
          { "@type": "Organization", "name": "TriWeb Media Productions" },
          { "@type": "Organization", "name": "TriWeb Software Company" }
        ]
      }
    </script>
  </head>
  <body>
    <noscript>
      <p style="padding:2rem;color:#f5f3ef;background:#0b1220;font-family:sans-serif">
        TriWeb Solutions: please enable JavaScript to view this website.
      </p>
    </noscript>
    <div id="splash" aria-hidden="true"><!--splash-logo--><div class="w"><b>triweb</b><span>solutions</span></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
